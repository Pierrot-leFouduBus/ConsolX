# Continuous integration: installs, checks, tests and builds the project on Windows.
name: CI

on:
  # Every push to a branch (version tags will get their own release workflow).
  push:
    branches: ['**']
  # Pull requests, including those from forks.
  pull_request:

# The workflow only needs to read the code.
permissions:
  contents: read

# When a newer commit arrives on the same branch, cancel the check still running.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check (Windows)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out the code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # Clean install from package-lock.json; also downloads the Electron binary.
      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Check types
        run: npm run typecheck

      - name: Run unit tests
        run: npm test

      - name: Build
        run: npm run build

      # Starts the built app with Playwright and drives it: tabs, splits, shells.
      - name: Run end-to-end tests
        run: npm run test:e2e
