# Release: on a version tag (v0.1.0, v0.2.0...), builds the Windows installer and
# publishes it as a GitHub Release, where installed apps find their updates.
name: Release

on:
  push:
    tags: ['v*']

# Needed to create the release and upload the installer.
permissions:
  contents: write

jobs:
  release:
    name: Build and publish (Windows)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out the code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # The release takes its number from the app version, so the tag must match it.
      - name: Check that the tag matches the app version
        shell: bash
        run: |
          version=$(node -p "require('./apps/desktop/package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match the app version $version." >&2
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check types
        run: npm run typecheck

      - name: Run unit tests
        run: npm test

      # Create the release as a draft first, so that electron-builder uploads all its files
      # to it. Left to itself, electron-builder can create the same release twice.
      - name: Create a draft release
        shell: bash
        run: |
          gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" --draft --verify-tag \
              --title "${GITHUB_REF_NAME#v}" --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Builds the installer and latest.yml, then uploads them to the draft release.
      - name: Build and upload the installer
        run: npm run release:github --workspace @consolx/desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Make the release public: installed apps now find the new version.
      - name: Publish the release
        shell: bash
        run: gh release edit "$GITHUB_REF_NAME" --draft=false --latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
